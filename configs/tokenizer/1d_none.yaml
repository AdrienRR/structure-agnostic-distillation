# Tokenizer: 1D sequence (32 tokens x 128), no distillation.
# Trained for 50 epochs at global batch 256 (8 per GPU x 8 GPUs x 4 nodes).
# Requires IMAGENET_ROOT (see README).
model:
  base_learning_rate: 0.0001
  target: ldm.models.conv_token_pool_autoencoder.ConvTokenPoolAutoencoderKL
  params:
    monitor: val/rec_loss
    embed_dim: 128
    use_vf: null
    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 5001
        kl_weight: 1.0e-06
        disc_weight: 0.5
    num_tokens: 32
    attn_heads: 8
    attn_depth: 2
    ddconfig:
      double_z: false
      z_channels: 128
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 1, 2, 2, 4]
      num_res_blocks: 2
      attn_resolutions: [16]
      dropout: 0.0
data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 8
    wrap: true
    train:
      target: ldm.data.imagenet.ImageNetTrain
      params:
        data_root: ${oc.env:IMAGENET_ROOT}
    validation:
      target: ldm.data.imagenet.ImageNetValidation
      params:
        data_root: ${oc.env:IMAGENET_ROOT}
lightning:
  trainer:
    devices: 8
    num_nodes: 4
    strategy: ddp_find_unused_parameters_true
    accelerator: gpu
    max_epochs: 50
    precision: 32
