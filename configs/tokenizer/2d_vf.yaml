# Tokenizer: 2D grid, VF loss (VA-VAE, position-wise) with DINOv2 ViT-L/14.
# Trained for 50 epochs at global batch 256 (8 per GPU x 8 GPUs x 4 nodes).
# Requires IMAGENET_ROOT (see README).
model:
  base_learning_rate: 0.0001
  target: ldm.models.autoencoder.AutoencoderKL
  params:
    monitor: val/rec_loss
    embed_dim: 32
    use_vf: dinov2
    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 5001
        kl_weight: 1.0e-06
        disc_weight: 0.5
        vf_weight: 0.1
        adaptive_vf: true
        distmat_margin: 0.25
        cos_margin: 0.5
    ddconfig:
      double_z: true
      z_channels: 32
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 1, 2, 2, 4]
      num_res_blocks: 2
      attn_resolutions: [16]
      dropout: 0.0
data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 8
    wrap: true
    train:
      target: ldm.data.imagenet.ImageNetTrain
      params:
        data_root: ${oc.env:IMAGENET_ROOT}
    validation:
      target: ldm.data.imagenet.ImageNetValidation
      params:
        data_root: ${oc.env:IMAGENET_ROOT}
lightning:
  trainer:
    devices: 8
    num_nodes: 4
    strategy: ddp_find_unused_parameters_true
    accelerator: gpu
    max_epochs: 50
    precision: 32
