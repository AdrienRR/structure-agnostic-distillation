[project]
name = "structure-agnostic-distillation"
version = "1.0.0"
description = "Code for \"Diffusable Latents from Structure-Agnostic Distillation\""
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.10.*"
dependencies = [
    "torch==2.2.0",
    "torchvision==0.17.0",
    "pytorch-lightning==2.4.0",
    "accelerate==1.13.0",
    "timm==1.0.12",
    "transformers==4.57.6",
    "huggingface-hub==0.36.2",
    "safetensors==0.8.0",
    "omegaconf==2.3.0",
    "einops==0.8.2",
    "torchdiffeq==0.2.5",
    "numpy==1.26.4",
    "scipy==1.15.3",
    "pillow",
    "pyyaml",
    "tqdm",
    "tensorboard",
    # taming-transformers: LPIPS, PatchGAN discriminator and the ImageNet data utilities,
    # plus what its ImageNet loader imports
    "taming-transformers-rom1504==0.0.6",
    "albumentations==2.0.8",
    "opencv-python-headless==4.9.0.80",
    "scikit-image==0.25.2",
    "requests",
]

[tool.uv]
package = false
# CUDA 12.1 wheels of torch exist for linux x86_64 only
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
